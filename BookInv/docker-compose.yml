services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/var/:/var/certbot/:ro
      - ./certbot/etc/:/etc/letsencrypt/:ro
    ports:
      - "80:80"
      - 443:443
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/var/:/var/certbot/:rw
      - ./certbot/etc/:/etc/letsencrypt/:rw   
  fastapi:
    build: .      
    ports:
      - "8000:8000"
    env_file:
      .env
    environment:
      DB_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PWD}@bookinv-db:5432/${POSTGRES_DB}"
      
  postgres:
    image: postgres:15
    container_name: bookinv-db
    env_file:
      .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"  
networks:
  default:
    name: bookinv_default
    driver: bridge
    