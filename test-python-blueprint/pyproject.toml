[project]
name = "test-python-blueprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhana-Jawahar", email = "Dhana.s.nalits@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fact",
]

[project.scripts]
test-python-blueprint = "test_python_blueprint:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
fact = { path = "../python-blueprint/dist/fact-1.0.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
]
